name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PXT
        run: npm install -g pxt

      - name: Initialize, Install and Build
        run: |
          pxt target arcade
          pxt install
          pxt build

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Ultima Compilacion Automatica"
          body: "Este archivo se actualiza automaticamente con cada push."
          draft: false
          prerelease: true
          files: |
            built/*.uf2
            built/*.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
