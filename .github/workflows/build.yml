name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PXT
        run: npm install -g pxt

      - name: Initialize, Install and Build
        run: |
          pxt target arcade
          pxt install
          pxt build

      - name: Locate and Upload Binary
        run: |
          # Búsqueda exhaustiva del archivo compilado y subida a Github Release
          file=$(find . -name "*.uf2" | head -n 1)
          if [ -n "$file" ]; then
            echo "Archivo encontrado: $file"
            # Instalar la herramienta hub o usar la API para adjuntar
            gh release upload latest "$file" --clobber || true
          else
            echo "No se encontró el archivo .uf2, buscando en el directorio..."
            ls -la
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
