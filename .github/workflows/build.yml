name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PXT
        run: npm install -g pxt

      - name: Initialize, Install and Build
        run: |
          pxt target arcade
          pxt install
          # Instalamos una variante de hardware para forzar la creación del .uf2
          # 'rpi' es la más común para arcade, si usas otra (como meowbit) puedes cambiarla
          pxt add hw---rpi || true
          pxt build

      - name: Locate and Upload Binary
        run: |
          # Buscamos el archivo en cualquier parte de la carpeta 'built'
          FILE=$(find built -name "*.uf2" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No se encontró .uf2 en 'built', buscando en todo el proyecto..."
            FILE=$(find . -name "*.uf2" | head -n 1)
          fi

          if [ -n "$FILE" ]; then
            echo "Subiendo: $FILE"
            gh release upload latest "$FILE" --clobber
          else
            echo "ERROR: No se generó ningún archivo .uf2"
            ls -R built
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
