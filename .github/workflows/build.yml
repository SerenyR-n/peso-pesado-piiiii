name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Actualizado a la versión 20 para evitar avisos

      - name: Install PXT
        run: npm install -g pxt

      - name: Initialize and Build
        run: |
          pxt target arcade
          pxt build --no-cache # Quitamos el --all que causaba el error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            built/binary.uf2
            built/binary.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
