name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PXT
        run: npm install -g pxt

      - name: Force Hardware & Build
        run: |
          pxt target arcade
          # Editamos el pxt.json para incluir explícitamente el hardware de consola
          python3 -c '
          import json, os
          if os.path.exists("pxt.json"):
              with open("pxt.json", "r") as f:
                  data = json.load(f)
              if "dependencies" not in data: data["dependencies"] = {}
              # Añadimos soporte para Raspberry Pi Arcade que genera .uf2
              data["dependencies"]["hw---rpi"] = "*"
              with open("pxt.json", "w") as f:
                  json.dump(data, f, indent=4)
          '
          pxt install
          # Solo "pxt build", nada más. Cero banderas.
          pxt build

      - name: Locate and Upload Binary
        run: |
          # Buscamos cualquier archivo .uf2 que se haya generado
          FILE=$(find . -name "*.uf2" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -n "$FILE" ]; then
            echo "¡ÉXITO! Encontrado: $FILE"
            gh release upload latest "$FILE" --clobber
          else
            echo "ERROR: Solo se generó el simulador JS."
            echo "Contenido de la carpeta built:"
            ls -R built || echo "Carpeta built no existe"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
