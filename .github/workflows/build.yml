name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PXT
        run: npm install -g pxt

      - name: Force Hardware & Build
        run: |
          pxt target arcade
          # Este script de python añade el hardware al pxt.json manualmente
          python3 -c '
          import json
          with open("pxt.json", "r") as f:
              data = json.load(f)
          if "dependencies" not in data: data["dependencies"] = {}
          data["dependencies"]["hw---rpi"] = "*"
          with open("pxt.json", "w") as f:
              json.dump(data, f, indent=4)
          '
          pxt install
          pxt build --no-cache

      - name: Locate and Upload Binary
        run: |
          # Buscamos de forma agresiva
          FILE=$(find . -name "*.uf2" | head -n 1)
          
          if [ -n "$FILE" ]; then
            echo "¡ENCONTRADO!: $FILE"
            gh release upload latest "$FILE" --clobber
          else
            echo "ERROR: Solo se generó JS. Contenido de built:"
            ls -R built
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
