name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PXT
        run: npm install -g pxt

      - name: Initialize, Install and Build
        run: |
          pxt target arcade
          pxt install
          # Forzamos la compilación para hardware común para asegurar la creación del .uf2
          pxt build --common

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Última Compilación Automática"
          body: "Compilación generada el ${{ github.event.head_commit.timestamp }}. Si no ves el .uf2, revisa los logs de compilación."
          draft: false
          prerelease: true
          # Usamos búsqueda recursiva total para encontrar el binario
          files: |
            **/built/**/*.uf2
            **/built/**/*.elf
            built/binary.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
