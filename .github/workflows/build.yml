name: MakeCode Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # Añadimos permisos explícitos aquí por si acaso
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PXT
        run: npm install -g pxt

      - name: Initialize, Install and Build
        run: |
          pxt target arcade
          pxt install
          pxt build --hw rpi # Forzamos la compilación de hardware para asegurar el .uf2

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Última Compilación Automática"
          body: "Archivo actualizado el ${{ github.event.head_commit.timestamp }}"
          draft: false
          prerelease: true
          files: |
            **/*.uf2
            **/*.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
